[package]
name = "loment-studio-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local HTTP backend for the Loment parameter desk"

[[bin]]
name = "loment-studio-server"
path = "src/main.rs"

[dependencies]
loment-params = { path = "../params" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
