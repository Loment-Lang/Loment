# 线上书 —— `book/` 渲染成静态站，走 GitHub Pages。
#
# 渲染器是仓内的 `tools/loment_book_site.py`（纯标准库，不引 mdBook / Jekyll）：
# 门禁里的 `loment_book_site_test` 与这里跑的是同一份实现，所以"能发出去的站"
# 与"判据验过的站"不会是两份东西。
#
# 触发面只有书本身与渲染器；改一章就重发一次，别的东西不动这个站。
# Pages 的来源是 **workflow**（仓库设置 → Pages → Build and deployment → GitHub Actions），
# 部署记录会落在 `github-pages` 环境里 —— 这就是 Deployments 里的站点那一条。

name: book

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "contributing/**"
      - "tools/loment_book_site.py"
      - ".github/workflows/book.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: book-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      # `--check` 先自己验一遍站内链接：落空就不要发出去。
      - name: Render the book
        run: python tools/loment_book_site.py --out _site --check
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
