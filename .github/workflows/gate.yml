# 静态门禁 —— **已经是必需检查**（`main` 的保护规则里 `ci.py --static-only` 挂着）
#
# ## 它为什么不是"全绿才算过"（历史，别删）
#
# 第一轮（2026-09-22 搬上 CI）是**测量轮**：62 条 43 PASS / 19 FAIL，整轮 6m23s，
# artifact 里有原始日志。那一轮不当门用是对的 —— 19 条红里 15 条是"本机全绿、runner 上红"
# 的 Linux 可移植性问题，而基线**必须实测**，否则接上必需检查的第一天就是 19 条红的噪音。
# 2026-09-24 复核时那个状态已经过去了：基线收到 8 条，保护规则里已经挂上这个 job。
#
# 所以判据不是"全绿"而是**"不新增红"**：基线（`.github/gate-baseline.txt`，**实测**
# 出来的那份清单）上的红不判失败，**清单之外的**红判失败。两处细节（各片与 `static` 里
# 各有一半，别搬走）:
#   * **新红先单跑一遍再判**：并行轮里的红有一部分只是撞上了别的套件在写同一棵树
#     （`CONTRIBUTING.md` 记过）。单跑还是红才算数 —— 误报的门会被人忽略。
#   * **基线只许变短**：哪一条修好了就在同一个 PR 里删掉它，否则 summary 会一直提醒。
#
# ## 它长成现在这样，是两轮实测的结果（docs/213）
#
# 第一轮（2026-10-09）：整道门禁 **20m10s**，而墙钟被**一条判据里的一步**钉死 ——
# `loment_dist_test` 一条 954s，其中 3/4 花在"用 stage1 重编自举驱动"上，而那是
# **同一件事的第二遍**（`loment_seed_test` 已经用便宜得多的方式付过账）。拿掉它之后
# 按实测耗时切成 N 片：**片是并行 job，片内仍是 `-j 4`**。→ **5m15s**。
#
# 第二轮（2026-10-10）：剩下最重那一片的墙钟里，**装工具链占了 95s**（apt 55s +
# LLVM 19 35s），而那是"同一份东西装 N 遍"。于是把工具链做成**镜像**
# （`.github/ci/Dockerfile`，由 `ci-image.yml` 构建推送），各 job 只拉它，**一次 apt
# 都不跑**。顺带把"apt 在镜像上抽风"的暴露面也一起消掉 —— 抽风那次发生在**构建**里，
# 不占任何人的墙钟。
#
# 分片表**不在这个文件里**：`python tools/ci.py --shard-plan N` 打印它，而它是把
# `STATIC_CHECKS` 全表切出来的**划分**（覆盖是构造性的，见 `ci.py:shards`）。
# 手写一张名单在这里，新增判据就会静默落在所有片之外 —— 那条判据从此不跑，
# 而门禁照样绿。这正是本仓反复踩过的那类洞。
#
# ## 四种用法
#
#   1) 自动: PR 与 push 到 main → 各片并行跑 → `static` 合起来汇总、对基线判失败；
#   2) 手动给 `suite`（模块名，如 `loment_tools_test`）→ 只跑那一个套件、打**全量
#      输出**。为什么需要这条: `tools/ci.py` 每条只留**最后一行**，那不够定位病因；
#   3) 手动给 `only`（逗号分隔的子串）→ 走 ci.py 只跑那几条，用来快速确认"修好了"；
#   4) 手动给 `diagnose_twin` → 跑写死的定向探针。
#   2)~4) 都走 `static-manual` 那个 job（它**不**叫 `ci.py --static-only`）：它们是手工
#   诊断，不该顶替 PR 上那道门，也不该被摊进分片（分片的前提是"跑全部"）。
#
# ## 五条边界（都来自仓库自己的纪律）
#
#   * **不新增 tools/*.py** —— `loment_release.GLOBS` 是显式清单，新增一个工具文件
#     会让发布清单过期；所以汇总/比对逻辑写在 workflow 里，不落成脚本。
#   * **不碰 lom/**、**不改任何判据** —— 把门禁搬上 CI 不该顺手改判据。
#   * **`static` 那个 job 的名字不许改**：它**就是**保护规则里挂着的那个必需检查名。
#     分片之后真正干活的是 `static-shard`（矩阵，名字带 `(K/N)` 后缀），
#     所以那一名必须由 `static` 扛着 —— 名字一没，保护规则就永远等不到它，
#     PR 会**全部**卡住（而不是松开）。
#   * **镜像的 tag 在两处**：这里各 job 的 `container.image` 与 `ci-image.yml` 的 `TAG`。
#     改镜像要同时抬这两处 —— 抬 tag 是让各 job 用上新镜像的**唯一**动作。
#   * **容器里的包不许随手改**：名单的来路与两条纪律写在 `.github/ci/Dockerfile` 里
#     （少一个包 = 一条假红；**不加** `rustc`/`dotnet`/`nvim`，因为那几条判据的 SKIP
#     已经写进基线，加进来是改覆盖面而不是改进）。改完跑一遍门禁，看 `环境自述`。

name: gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: '单跑这些套件（模块名，逗号分隔，如 loment_grammar_test,loment_p7_test）。留空 = 跑整道门禁'
        required: false
        default: ''
      only:
        description: '走 ci.py 只跑名字含这些子串的几条（逗号分隔）。留空 = 全部'
        required: false
        default: ''
      diagnose_twin:
        description: '跑"孪生二进制段错误"的定向探针（写死的固定步骤，不是任意命令）。true = 跑'
        required: false
        default: ''

permissions:
  contents: read

#: 分几片。它**必须**与 `tools/ci.py shards()` 的分法一致 —— 下面矩阵里每条的 `total`
#: 与 `--shard K/N` 的 N 都是它。写错了分片划分就变，并集不再是 `STATIC_CHECKS`，
#: 而聚合那一步会**数**出来并失败（不是静默少跑几条）。
env:
  GATE_SHARDS: "6"
  #: **容器里的 git 要靠这一条才肯干活。** 工作区是 runner 的用户 checkout 的（UID 不是
  #: 容器里的 root），git 于是拿 "dubious ownership" 拒绝 `ls-files` / `rev-parse` /
  #: `check-attr` / `check-ignore` —— 而好几条判据正是靠这几个子命令的。2026-10-10 换上
  #: 容器那次实测：`loment_eol` 报"不是 git 工作树"、`loment_src` 报"git ls-files 失败"、
  #: `loment_publish` 把 git 的提示原文打了出来，连 `loment_seed_test` 的 gitattributes
  #: 那条也一起红。
  #:
  #: 用 **git 自己的环境变量入口**注入（`GIT_CONFIG_COUNT` 那一族等价于 `git -c`），
  #: 于是不必在每个 job 里各写一遍 `git config --add safe.directory`。
  #:
  #: 值取 `*` 而**不是** `${{ github.workspace }}`：那个 context 是**宿主**的路径
  #: （`/home/runner/work/loment/loment`），而容器里看到的同一棵树在 `/__w/loment/loment`
  #: —— git 自己的提示原文打的就是后者。路径写死就**静默打不中**，这一类"看着配上了、
  #: 其实没配上"最费时间。CI 容器里只有我们自己这一棵树，`*` 不多放行任何东西。
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "safe.directory"
  GIT_CONFIG_VALUE_0: "*"

#: **容器里 `run:` 的默认 shell 是 `sh`（dash），不是 runner 上的 bash。** 这不是小事：
#: 2026-10-10 实测，`static-manual` 那条"单跑套件"里的 `read -ra parts <<< "..."` 在容器
#: 里直接 `Syntax error: redirection unexpected`（`<<<` 是 bash 的 herestring）。各分片
#: 那几条恰好都只用了 POSIX 写法所以没炸 —— 那是**运气**，不是设计。统一声明成 bash：
#: 镜像里有 bash，而门禁里这些汇总/比对的脚本本来就是在 bash 下写的。
defaults:
  run:
    shell: bash

jobs:
  # `lom/` 禁区 —— CONTRIBUTING「Do not change anything under `lom/`」那一节。
  #
  # **为什么要有这个 job**: 那一条把机制描述成"自动检测并关闭"，而 2026-09-22 查过 ——
  # 仓里此前**没有任何东西**做这件事。一条写在文档里、没有实现的规矩，是最坏的一种：
  # 它让**外面**的贡献者以为会被拦下，实际不会。这个 job 就是那句话可验证的那一半 ——
  # **检测**。剩下的一半（关闭 PR、三次禁言）需要仓库设置或一个 org 级 App，
  # 不是这个文件能单方面做到的，所以 CONTRIBUTING 的措辞也改成说实话。
  #
  # **为什么不 checkout**: 这个 job 骑在**别人的**补丁上跑，而它要的只是一串**文件名**。
  # 一个字节都不取进工作区，就没有"未审代码被执行"的面。也正因如此它**不需要**
  # `pull_request_target`（那个事件为了拿写权限会带来真实的注入风险）—— 只读 token
  # 就够读文件列表。
  #
  # **它为什么不进分片、也不进容器**：它一个字节都不从树里取，跑 5 秒，只要 `gh` 与
  # `jq`（runner 上现成）。摊进分片只会让它跟着某一片排队。
  lom-door:
    name: lom/ 禁区
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: 检出 `lom/**` 的改动
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail
          err=$(mktemp)
          files=""
          rc=0
          # **带 status 取文件名**（`added` / `modified` / `removed` / `renamed`）——
          # 这个 job 拦的是"**改**契约"，而**新增一份**契约文件不是改：
          # 既有那几份（`fuai` / `fuc` / `fujr`）一个字节都没动，对面那一半也就没被碰。
          # 所以下面按 status 分流：非 `added` 的才拦，`added` 的只列出来（见 2026-10-11 那条）。
          if [ "$EVENT" = "pull_request" ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .status + "|" + .filename' 2>"$err") || rc=$?
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api --paginate "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[] | .status + "|" + .filename' 2>"$err") || rc=$?
          else
            # 新分支的首次 push（`before` 是全零）—— 退回看这一个提交自己动了什么
            files=$(gh api --paginate "repos/$REPO/commits/$AFTER" --jq '.files[] | .status + "|" + .filename' 2>"$err") || rc=$?
          fi
          # **列不出来就按失败算**（fail closed）。`gh` 拿不到文件列表时 `files` 是空串，
          # 下面的 `grep` 于是找不到 `lom/` 而**放行** —— 那是这个 job 最坏的失败形状:
          # 一个 token 权限不对或 API 抽风就能让门**静默失效**，而它正是为此存在的。
          if [ "$rc" != 0 ]; then
            echo "::error::列改动文件失败 —— 门禁无法判定，按失败处理（不静默放行）"
            cat "$err"
            exit 1
          fi
          # **push 到 main 的那一跑要认出"这是走 PR 合进来的"。** 门在 PR 上已经拦过一次，
          # 人也已经做过决定（admin 合就是那个决定的形状）—— 那一跑不该再红：否则**每一次
          # 被认可**的 L0 改动都会在 main 上留一个红记号，而"门经常红"恰好教会所有人忽略它。
          # **直接 push 到 main 的非合并提交照旧拦** —— 那条路绕过了 PR，没有人做过决定。
          #
          # 判据是"这个提交是不是合并提交"（parents >= 2）。取不到就按 1 算（保守：仍然拦）。
          via_pr=0
          if [ "$EVENT" != "pull_request" ] && [ -n "${AFTER:-}" ]; then
            parents=$(gh api "repos/$REPO/commits/$AFTER" --jq '.parents | length' 2>/dev/null || echo 1)
            case "${parents:-1}" in
              ''|*[!0-9]*) parents=1 ;;
            esac
            if [ "$parents" -ge 2 ]; then
              via_pr=1
            fi
          fi
          # **`status` 那一列必须是三种之一**：API 换了形状（比如 status 没了）时要**红**，
          # 而不是让所有行都落进"不是 added"里 —— 那会把新增也拦下（保守，但仍是不对的红），
          # 或者更糟：反过来把改动当新增放行。所以先验形状。
          if [ -n "$files" ]; then
            shape=$(printf '%s\n' "$files" | grep -cv '|' || true)
            if [ "$shape" != 0 ]; then
              echo "::error::文件列表的形状变了（$shape 行没有 status 列）—— 门禁无法判定，按失败处理"
              printf '%s\n' "$files" | head -5
              exit 1
            fi
          fi
          n=$(printf '%s\n' "$files" | grep -c . || true)
          bad=$(printf '%s\n' "$files" | grep '|lom/' | grep -v '^added|' | cut -d'|' -f2- || true)
          newf=$(printf '%s\n' "$files" | grep '^added|lom/' | cut -d'|' -f2- || true)
          if [ -z "$bad" ]; then
            if [ -n "$newf" ]; then
              {
                echo "## \`lom/\` 禁区：**新增**了 L0 文件（不拦）"
                echo ""
                echo "这个 job 拦的是**改动既有契约** —— 那几份的对面在另一个仓库，本仓单方面"
                echo "看不出改坏没改坏。**新增**一份不是改：既有那几份一个字节都没动。"
                echo "新增的那份仍要自己的判据（它一旦被谁依赖，改它就回到这条门下面）。"
                echo ""
                echo '```'
                echo "$newf"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "lom/ 禁区: 无**改动**（比对了 $n 个文件，其中新增 ${newf:+$(printf '%s\n' "$newf" | grep -c .)} 个 lom/ 文件）"
            exit 0
          fi
          if [ "$via_pr" = 1 ]; then
            # 走 PR 合进来的：门在 PR 上已经拦过、决定也做过了（admin 合）。
            # 这里只**记下来**，不判失败 —— 判失败等于让每一次认可的改动都在 main 上留红。
            {
              echo "## \`lom/\` 禁区：这次**改**了 L0 接口层（已走 PR 合进来，**不判失败**）"
              echo ""
              echo "这条改动在 PR 上被门拦过一次，人做过决定之后才合的（admin 合）。"
              echo "main 这一跑只把它**记下来**；**直接 push 的非合并提交照旧拦**。"
              echo ""
              echo '```'
              echo "$bad"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$bad" | while read -r f; do
              echo "::notice file=$f::改了 L0 接口层（走 PR 合进来 —— 门在 PR 上拦过，已决定）"
            done
            exit 0
          fi
          {
            echo "## \`lom/\` 禁区：这次**改**了 L0 接口层"
            echo ""
            echo "接口对面那一半在**另一个仓库**里，从本仓单方面看不出改坏没改坏 ——"
            echo "所以这里不评审，只拦下。想让接口变，去开 issue，那不是一个补丁。"
            echo ""
            echo "（**新增**一份 L0 文件不在这条门下面 —— 那几份既有契约一个字节都没动。"
            echo "门拦的是下面这些 \`modified\`/\`removed\`/\`renamed\`。）"
            echo ""
            echo '```'
            echo "$bad"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$bad" | while read -r f; do
            echo "::error file=$f::改了 L0 接口层（lom/ 禁区）—— 见 CONTRIBUTING.md"
          done
          if [ -n "$newf" ]; then
            # 同一笔里既有"改既有契约"又有"新增"时，把新增那条也说出来 ——
            # 免得读者以为 red 的名单里那几行是"新增"。
            echo "$newf" | while read -r f; do
              echo "::notice file=$f::新增 L0 文件（不在这条门下面，等它被依赖了才需要）"
            done
          fi
          exit 1

  # 独占那一条（`EXCLUSIVE_STATIC`）**先单独跑完**，其余分片 `needs:` 它。
  #
  # **为什么非单独一个 job 不可**（这是分片本身不会给你的保证）：独占的成员写**仓库里的
  # 共享位置**（`lompi_sync` 会同步 `lompi/`），所以"不能与别的判据同时跑"—— 而摊到并行
  # job 上之后，那句话里的"同时"**还包括别的 job**。`ci.py:shards` 把这一片排在片 1，
  # 这里再用 `needs:` 把它与其余分片串起来，两件事缺一不可。
  #
  # **它的步骤与 `static-shard` 是同一套**（只差矩阵那几行），改一边要改两边。没有抽成
  # composite action 是因为门禁自己的纪律："逻辑写在 workflow 里，不落成脚本"。两边走样
  # 的后果由两道守卫兜住：聚合那步的"合成条数 == STATIC_CHECKS"，以及"任一片红就是红"。
  static-exclusive:
    name: 静态门禁（独占那一片）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event.inputs.suite == '' && github.event.inputs.only == '' && github.event.inputs.diagnose_twin != 'true' }}
    # **它故意不拉镜像。** 这一片（现在只有 `lompi_sync`）一条外部命令都不碰，而要命的是
    # 它**串在其余五片前面**（`needs:`，独占那条保证要的）：拉镜像那 ~60s 会变成
    # **整道门禁的前置等待**。2026-10-10 实测过一次：加了容器之后这一片 8s → 62s，
    # 而它带来的净收益（各片把 95s 的 apt 换成 ~55s 的拉取）一共才四十来秒
    # —— 于是总墙钟从 5m13s 变成 **5m38s**，白改。
    #
    # 所以这一片留在 runner 上：要的东西它本来就有（python3 + git），而 `git`
    # 在 runner 上也不会有容器那套 "dubious ownership"。**它的成员必须保持
    # "一条外部命令都不碰"** —— 哪天往 `EXCLUSIVE_STATIC` 里加一条要用工具链的，
    # 它在这里会直接因为缺命令而红（那是能看见的，不是静默）。
    steps:
      # **`fetch-depth: 0`（2026-10-16 起）**：`lom_audit` 的 M93/M95 要问一句
      # "自手册/台账上次被写出以来，哪些路径动过" —— 那是它们**滞后容差**的那一半
      # （容差为什么必须有，见 `.github/workflows/manifest.yml` 文件头那节）。
      # `actions/checkout` 默认是 `fetch-depth: 1`，`git log` 就只看得到 HEAD，
      # 那样问出来的答案是"什么都没动"⇒ 这两个判据会把每个 PR 都判红。
      # 拿不到历史时它们**不静默放行**，会报一条指名要这个参数的账。
      # 这个仓的 pack 是 ~32 MiB / 1400 多个提交，全取一次是秒级，换得起。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 先自述环境 —— 这样"红"才有归因: 是仓库的问题，还是**这一台**上缺了那个命令。
      # 这一片跑在 **runner** 上（不拉镜像，见上面那段），所以这里列的就是 runner 自带的
      # 那几件；其余分片的自述在它们各自的 job 里（列的是镜像里的，clang 那行会是 19）。
      - name: 环境自述
        run: |
          echo "runner: $(uname -a)"
          echo "python: $(python3 -V)"
          echo "cpu: $(nproc)"
          for t in python3 git gh sh make; do
            printf '%-20s %s\n' "$t" "$(command -v "$t" || echo '—— 缺')"
          done

      - name: 跑这一片
        run: |
          python3 tools/ci.py --shard-plan "$GATE_SHARDS" | sed -n "1p"
          python3 tools/ci.py --static-only --shard "1/$GATE_SHARDS" > gate.out 2>&1 || true
          echo "--- 尾 30 行 ---"
          tail -30 gate.out

      - name: 汇总（这一片）
        if: ${{ always() }}
        run: |
          set +e
          pass=$(grep -c ':: \[static\].*PASS' gate.out || true)
          fail=$(grep -c ':: \[static\].*FAIL' gate.out || true)
          echo "独占片: 绿 $pass / 红 $fail / 共 $((pass + fail))"
          {
            echo "## 静态门禁（独占那一片）—— 测量"
            echo ""
            echo "绿 **$pass** · 红 **$fail** · 共 **$((pass + fail))**"
            echo '```'
            grep ':: \[static\]' gate.out || echo "（无）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 判据预算（`#371`）—— 与各分片那一步同一个理由（那里有完整说明）：`ci.py` 在
      # **每条判据都 PASS** 时也可能判失败，而那种失败不在 `:: [static] … FAIL` 里。
      - name: 判据预算（#371）
        if: ${{ always() }}
        run: |
          set +e
          if grep -q 'fujoci: 判据预算对不上' gate.out; then
            {
              echo "## 判据预算对不上（#371）"
              echo ""
              echo '```'
              sed -n '/fujoci: 判据预算对不上/,$p' gate.out
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::判据预算对不上 —— 每一条失败行都带着可以直接粘进预算文件的行"
            exit 1
          fi
          echo "判据预算: OK"

      - name: 对照基线（这一片的新红，单跑确认）
        if: ${{ always() }}
        run: |
          set +e
          : > red.txt; : > base.txt; : > new_red.txt
          : > confirmed.txt; : > flaked.txt
          if [ ! -f .github/gate-baseline.txt ]; then
            echo "::error::基线文件 .github/gate-baseline.txt 不见了 —— 门禁不猜，直接判失败"
            exit 1
          fi
          grep -E ':: \[static\].*FAIL' gate.out | awk '{print $3}' | sort -u > red.txt
          grep -v '^[[:space:]]*#' .github/gate-baseline.txt | awk 'NF {print $1}' | sort -u > base.txt
          comm -13 base.txt red.txt > new_red.txt
          while read -r name; do
            [ -z "$name" ] && continue
            echo "=== 新红复跑（单跑）: $name ==="
            python3 tools/ci.py --static-only --only-static "$name" > "re_$name.log" 2>&1
            rc=$?
            tail -4 "re_$name.log"
            if [ $rc -eq 0 ]; then
              echo "  -> 单跑**绿**：判为并行假红（不计入判据）"
              echo "$name" >> flaked.txt
            else
              echo "  -> 单跑**仍红**：这是这一笔引入的新红"
              echo "$name" >> confirmed.txt
            fi
          done < new_red.txt
          if [ -s confirmed.txt ]; then
            echo "::error::门禁（独占片）：新红 $(paste -sd ' ' confirmed.txt)"
            exit 1
          fi
          echo "独占片: 没有新红"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: gate-log-1
          path: |
            gate.out
            red.txt
            base.txt
            new_red.txt
            confirmed.txt
            flaked.txt
            re_*.log
          if-no-files-found: warn

  # **干活的那一半**：每一片是一个独立 runner，片内仍是 `-j 4`。
  #
  # `fail-fast: false` 是**必须**的：一片红不该让别的片被砍掉 —— 那样看到的是
  # "三片没跑"，而不是"这三片也红"。门禁红的时候最需要的就是**全部**红一起看见。
  #
  # `include:` 里那 5 行是 `python tools/ci.py --shard-plan 6` 的副本（片号、总数），
  # **不含片 1** —— 那是上面那个 job，这里用 `needs:` 与它串行。
  # **改分片形状要同时改 `ci.py` 和这里**。
  #
  # **6 这个数是量出来的**：5 片那一轮（run 38008195263）最重的是"均分"那两片之一
  # （301s = 装工具链 95s + 30 条判据的和 294s），而长尾那两片各自只要 180s / 202s。
  # 把均分的那两片再对半切，最重片就落到 seed 那片的地板上 —— 再往上加片只会让更多片
  # 各自付一次"起步"的钱，墙钟不动（它的下限是"最长的那条判据 + 起身那一段"）。
  static-shard:
    name: 静态门禁 ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `always()`：独占那片红了**也要**把其余五片跑完。`needs` 的默认行为是"依赖失败就
    # 跳过"，那样看到的是"五片没跑"而不是"这五片也红"。独占那片与这里并行**不会**踩到
    # 共享位置：它是**先跑完**的那一个。
    if: ${{ always() && github.event.inputs.suite == '' && github.event.inputs.only == '' && github.event.inputs.diagnose_twin != 'true' }}
    needs: [static-exclusive]
    container:
      # **路径里带着属主名**（`docs/255` §2）：库一换组织，这一行就得跟着换，而它**不是**
      # 算出来的 —— `ci-image.yml` 那边是 `github.repository_owner` 转小写，两边靠人看着对齐。
      # 顺序是硬的：先在新属主下把 tag 建出来、**再把它设成 public**（包默认私有，而 fork 的
      # PR 拿不到私有包 ⇒ 它们会死在"拉镜像"这一步）、**最后**才改这里。反了就是每一片都拉不到。
      image: ghcr.io/loment-lang/loment-ci:5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 2, total: 6 }
          - { shard: 3, total: 6 }
          - { shard: 4, total: 6 }
          - { shard: 5, total: 6 }
          - { shard: 6, total: 6 }
    steps:
      # 同 `static-exclusive`：`lom_audit` 的 M93/M95 要历史（见那一处的注释）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 环境自述
        run: |
          echo "runner: $(uname -a)"
          echo "python: $(python3 -V)"
          echo "cpu: $(nproc)"
          echo "clang: $(clang --version | head -1)"
          for t in clang clang++ lld ld.lld llvm-objdump llvm-nm llvm-ar rustc cargo \
                   qemu-system-x86_64 qemu-aarch64 go java javac node npm vim nvim \
                   python3 git gh sh make; do
            printf '%-20s %s\n' "$t" "$(command -v "$t" || echo '—— 缺')"
          done

      # 这一片是哪些判据 —— **从 `ci.py` 打印**，不在这里列名字（理由见文件头）。
      # 片内并行度 `-j` 用默认（min(8, nproc)）；片与片之间已经是并行的了，
      # 再往上抬 `-j` 只会让同一台 4 vCPU 的 runner 自己跟自己抢。
      - name: 跑这一片
        run: |
          python3 tools/ci.py --shard-plan "${{ matrix.total }}" | sed -n "${{ matrix.shard }}p"
          python3 tools/ci.py --static-only --shard "${{ matrix.shard }}/${{ matrix.total }}" \
            > gate.out 2>&1 || true
          echo "--- 尾 30 行 ---"
          tail -30 gate.out

      - name: 汇总（这一片）
        if: ${{ always() }}
        run: |
          set +e
          pass=$(grep -c ':: \[static\].*PASS' gate.out || true)
          fail=$(grep -c ':: \[static\].*FAIL' gate.out || true)
          echo "片 ${{ matrix.shard }}: 绿 $pass / 红 $fail / 共 $((pass + fail))"
          {
            echo "## 静态门禁 ${{ matrix.shard }}/${{ matrix.total }} —— 测量"
            echo ""
            echo "绿 **$pass** · 红 **$fail** · 共 **$((pass + fail))**"
            echo ""
            echo "### 红项"
            echo '```'
            grep ':: \[static\].*FAIL' gate.out || echo "（无）"
            echo '```'
            echo ""
            echo "### 最慢的 8 条（这一片）"
            echo '```'
            grep ':: \[static\]' gate.out | sort -k3 -rn | head -8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 判据预算（`#371`）—— **必须单独认，否则它是个隐形的失败**。
      #
      # `ci.py` 在**每条判据都 PASS** 的情况下也可能判失败：只要有人漏登记了一条跳过、
      # 或者动了地板。那种失败**不会**出现在 `:: [static] … FAIL` 里（没有任何一条套件
      # 失败），而下面"对照基线"那一步只读那些 FAIL 行；只看退出码又分不清"预算对不上"
      # 与"某条套件红"（后者要按"先单跑一遍"的规矩处理）。所以这里认那句原话。
      #
      # 落这一版时实测过一次：`gate-skips.txt` 空着、若少了这一步，预算不符的那几片
      # 会**报绿**（每条套件都写着 PASS），而这一整版就是冲着"没跑不算通过"来的。
      - name: 判据预算（#371）
        if: ${{ always() }}
        run: |
          set +e
          if grep -q 'fujoci: 判据预算对不上' gate.out; then
            {
              echo "## 判据预算对不上（#371）"
              echo ""
              echo '```'
              sed -n '/fujoci: 判据预算对不上/,$p' gate.out
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::判据预算对不上 —— 每一条失败行都带着可以直接粘进预算文件的行"
            exit 1
          fi
          echo "判据预算: OK"

      # 门那一半：**只对"基线之外的红"报红**，而且**先单跑一遍再判**。
      #
      # **单跑放在**这里**（而不是最后那个汇总 job）是有原因的**：单跑一次要**真的跑**
      # 那条判据，也就需要这一片的环境。汇总 job 只用 runner 上的 shell 与 `cat`，
      # 所以那里只汇总结果、不再动手跑。
      - name: 对照基线（这一片的新红，单跑确认）
        if: ${{ always() }}
        run: |
          set +e
          : > red.txt; : > base.txt; : > new_red.txt
          : > confirmed.txt; : > flaked.txt
          if [ ! -f .github/gate-baseline.txt ]; then
            echo "::error::基线文件 .github/gate-baseline.txt 不见了 —— 门禁不猜，直接判失败"
            exit 1
          fi
          grep -E ':: \[static\].*FAIL' gate.out | awk '{print $3}' | sort -u > red.txt
          grep -v '^[[:space:]]*#' .github/gate-baseline.txt | awk 'NF {print $1}' | sort -u > base.txt
          comm -13 base.txt red.txt > new_red.txt
          while read -r name; do
            [ -z "$name" ] && continue
            echo "=== 新红复跑（单跑）: $name ==="
            python3 tools/ci.py --static-only --only-static "$name" > "re_$name.log" 2>&1
            rc=$?
            tail -4 "re_$name.log"
            if [ $rc -eq 0 ]; then
              echo "  -> 单跑**绿**：判为并行假红（不计入判据）"
              echo "$name" >> flaked.txt
            else
              echo "  -> 单跑**仍红**：这是这一笔引入的新红"
              echo "$name" >> confirmed.txt
            fi
          done < new_red.txt
          if [ -s confirmed.txt ]; then
            echo "::error::门禁（片 ${{ matrix.shard }}）：新红 $(paste -sd ' ' confirmed.txt)"
            exit 1
          fi
          echo "片 ${{ matrix.shard }}: 没有新红"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: gate-log-${{ matrix.shard }}
          path: |
            gate.out
            red.txt
            base.txt
            new_red.txt
            confirmed.txt
            flaked.txt
            re_*.log
          if-no-files-found: warn

  # 手动用法（`suite` / `only` / `diagnose_twin`）—— 与日常那条路分开。它**不能**叫
  # `ci.py --static-only`：那一名是保护规则里挂着的必需检查，而手工跑的这次不是 PR 上
  # 的门。名字分开之后，两条路谁也不挡谁。
  static-manual:
    name: 门禁（手动：单跑套件 / 只跑几条 / 定向探针）
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: ${{ github.event.inputs.suite != '' || github.event.inputs.only != '' || github.event.inputs.diagnose_twin == 'true' }}
    container:
      # 与 `static-shard` 同一条镜像，理由与那句"顺序是硬的"见上面。
      image: ghcr.io/loment-lang/loment-ci:5
    steps:
      # 同 `static-exclusive`：`lom_audit` 的 M93/M95 要历史（见那一处的注释）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 环境自述
        run: |
          echo "runner: $(uname -a)"
          echo "python: $(python3 -V)"
          echo "cpu: $(nproc)"
          echo "clang: $(clang --version | head -1)"
          for t in clang clang++ lld ld.lld llvm-objdump llvm-nm llvm-ar rustc cargo \
                   qemu-system-x86_64 qemu-aarch64 go java javac node npm vim nvim \
                   python3 git gh sh make gdb; do
            printf '%-20s %s\n' "$t" "$(command -v "$t" || echo '—— 缺')"
          done

      # 用法 2: 单跑套件（可一次给多个，逗号分隔）—— 定位病因用。
      # 每条打三样: 退出码与行数、失败/异常行（**不靠尾部** —— 失败可能在中段，而套件
      # 后面还会继续打很多行）、尾 60 行。`ci.py` 每条只留最后一行，那样定位不了。
      - name: 单跑套件
        if: ${{ github.event.inputs.suite != '' }}
        run: |
          set +e
          IFS=',' read -ra parts <<< "${{ github.event.inputs.suite }}"
          for raw in "${parts[@]}"; do
            s="${raw//[[:space:]]/}"
            [ -z "$s" ] && continue
            echo "=================== tools/$s.py ==================="
            out="$(mktemp)"
            python3 "tools/$s.py" > "$out" 2>&1
            echo "rc=$?  输出行数=$(wc -l < "$out")"
            echo "--- 失败/异常行 ---"
            grep -nE 'FAIL|Error|error|Traceback|Assertion|assert' "$out" | head -40
            echo "--- 尾 60 行 ---"
            tail -60 "$out"
            rm -f "$out"
          done

      # 用法 3: 只跑几条（走 ci.py 的 `--only-static`）。打的是**那几条**的原样输出 ——
      # 这条路的用处是"我刚修完，确认一下"。
      - name: 只跑几条
        if: ${{ github.event.inputs.only != '' }}
        run: |
          set +e
          args=""
          IFS=',' read -ra parts <<< "${{ github.event.inputs.only }}"
          for p in "${parts[@]}"; do args="$args --only-static $p"; done
          python3 tools/ci.py --static-only $args 2>&1 | tail -60

      # 用法 4: 定向探针 —— 三条套件里的自举孪生二进制在 runner 上段错误（rc=-11），
      # 而本机（WSL，也是 Linux）全绿。这类事猜不出来，只能在 runner 上直接看。
      # **写死的固定步骤**，不做"任意命令"输入（这是公开仓）。
      # `gdb` 在镜像里（原来这一步会现装一次 —— 那也是"每次跑都装"的一种）。
      - name: 探针 —— 孪生二进制的段错误
        if: ${{ github.event.inputs.diagnose_twin == 'true' }}
        run: |
          set +e
          echo "### 地址布局 / 内核"
          echo "（上一轮已排除的两类：关 ASLR 与放大栈都没有改变结果）"
          echo "randomize_va_space: $(cat /proc/sys/kernel/randomize_va_space)"
          uname -a
          echo "cpu: $(nproc)"
          echo
          echo "### 控制组：直接跑（预期红 —— 孪生 rc=-11）"
          timeout 600 python3 tools/potato_test.py 2>&1 | tail -8
          echo
          echo "### 段错误地址（dmesg 那一行还带着出错指令的 ip）"
          dmesg 2>/dev/null | grep -iE "segfault|trap" | tail -4 \
            || echo "（dmesg 拿不到：容器里没有内核环缓冲的读权限）"
          echo
          echo "### gdb 跟着子进程抓现场：出错指令 + 周围的指令 + 寄存器里的坏地址"
          echo "### （固定 ip 说明同一个代码点拿到坏参数；rdi/rsi 就是那个参数）"
          timeout 900 gdb -batch -q \
            -ex "set follow-fork-mode child" \
            -ex "set detach-on-fork off" \
            -ex "set confirm off" \
            -ex run \
            -ex "info registers rip rax rbx rcx rdx rsi rdi rbp rsp" \
            -ex "x/10i \$rip-16" \
            -ex "bt" \
            --args python3 tools/potato_test.py 2>&1 | tail -70

  # `static` —— **这个名字就是保护规则里挂着的必需检查**（见文件头第三条边界）。
  # 它不跑任何判据（那是各分片的事），只做两件各分片单看不了的事：
  #   1. **把 N 片的 `gate.out` 合成一份** —— 于是"基线该变短了"能对着**整张表**算。
  #      各片单独算是错的：别的片跑到绿的那几条，在它眼里全都"不在我这一轮的红里"，
  #      会被误报成"已经绿了"。
  #   2. 一句话报出全貌（绿/红/新红/假红/过期基线）。
  # **它不拉镜像**：它只用 runner 上的 `cat`/`grep`/`sort`/`python3` 数一遍条数，
  # 拉一个 1GB 的镜像只为这个就是纯加墙钟。
  static:
    name: ci.py --static-only
    needs: [static-exclusive, static-shard]
    if: ${{ always() && github.event.inputs.suite == '' && github.event.inputs.only == '' && github.event.inputs.diagnose_twin != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: gate-log-*
          path: shards

      # 合成是靠约定（各片都叫 `gate.out`，下载进 `shards/gate-log-<K>/`）。
      # **少一片就少几条判据 —— 那不能静默**: 数对不上就红。
      # 这也是"N 写错了"的兜底: N 一偏，划分就变，并集就不再是 `STATIC_CHECKS` 那么多条。
      - name: 合成一份 gate.out
        run: |
          set +e
          cat shards/gate-log-*/*.out > gate.out 2>/dev/null
          got=$(grep -c ':: \[static\]' gate.out || true)
          want=$(python3 -c "import sys; sys.path.insert(0,'tools'); import ci; print(len(ci.STATIC_CHECKS))")
          echo "合成后 $got 条 / STATIC_CHECKS 里 $want 条"
          if [ "$got" != "$want" ]; then
            echo "::error::分片结果不齐：只有 $got 条，应为 $want 条 —— 有一片没跑完或没上传"
            exit 1
          fi

      - name: 汇总（全貌）
        run: |
          set +e
          pass=$(grep -c ':: \[static\].*PASS' gate.out || true)
          fail=$(grep -c ':: \[static\].*FAIL' gate.out || true)
          cat shards/gate-log-*/confirmed.txt 2>/dev/null | sed '/^$/d' | sort -u > confirmed.txt
          cat shards/gate-log-*/flaked.txt 2>/dev/null | sed '/^$/d' | sort -u > flaked.txt
          grep -E ':: \[static\].*FAIL' gate.out | awk '{print $3}' | sort -u > red.txt
          grep -v '^[[:space:]]*#' .github/gate-baseline.txt | awk 'NF {print $1}' | sort -u > base.txt
          comm -13 base.txt red.txt > new_red.txt
          comm -23 base.txt red.txt > gone.txt
          n_red=$(wc -l < red.txt | tr -d ' ')
          n_base=$(wc -l < base.txt | tr -d ' ')
          n_bad=$(wc -l < confirmed.txt | tr -d ' ')
          n_flake=$(wc -l < flaked.txt | tr -d ' ')
          n_gone=$(wc -l < gone.txt | tr -d ' ')
          echo "绿 $pass / 红 $fail / 共 $((pass + fail))"
          {
            echo "## 静态门禁 —— 全貌（各片合并）"
            echo ""
            echo "绿 **$pass** · 红 **$fail** · 共 **$((pass + fail))**"
            echo ""
            echo "本轮红 **$n_red** · 基线 **$n_base** · 新红 **$n_bad** · 并行假红 $n_flake · 基线已过期 $n_gone"
            echo ""
            echo "### 红项"
            echo '```'
            grep ':: \[static\].*FAIL' gate.out || echo "（无）"
            echo '```'
            echo ""
            if [ "$n_bad" -gt 0 ]; then
              echo "### 新红（这一笔引入的）"
              echo '```'
              cat confirmed.txt
              echo '```'
              echo ""
            fi
            if [ "$n_flake" -gt 0 ]; then
              echo "### 并行假红（单跑绿 —— **不**判失败）"
              echo '```'
              cat flaked.txt
              echo '```'
              echo ""
            fi
            if [ "$n_gone" -gt 0 ]; then
              echo "### 基线该变短了"
              echo '这几条已经绿了，请在**同一个 PR 里**从 `.github/gate-baseline.txt` 删掉：'
              echo '```'
              cat gone.txt
              echo '```'
              echo ""
            fi
            echo "### 最慢的 8 条（各片合计）"
            echo '```'
            grep ':: \[static\]' gate.out | sort -k3 -rn | head -8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n_bad" -gt 0 ]; then
            echo "::error::门禁：新红 $n_bad 条 —— $(paste -sd ' ' confirmed.txt)"
            exit 1
          fi

      # 基线**只许变短**（文件头那条纪律）—— 此前它只靠人自觉。把一条新红登记进基线，
      # 门禁从此对那条视而不见，而 summary 上那段"基线该变短了"是 **notice**、不判失败：
      # 于是"加一条"这条路一直开着，正是本 PR 要堵的那类洞。
      #
      # **为什么不在分片里做**：那一片只看得到自己片内的红，比出来的"新增"是假的
      # （别的片跑到绿的条目，在它眼里根本不在"我这一轮的红"里）。全表的对照面只有这里
      # 够得着 —— 与"基线该变短了"必须在这儿算，是同一个理由。
      #
      # **对照面从哪儿来**：本地树里没有基线的前一版（`actions/checkout` 默认只取一个
      # 提交），所以要**显式取一次**：PR 取 base 分支，push 取 `event.before`。
      # 取不到就**判失败**（fail closed）—— 与 `lom-door` 那条"列不出文件列表就按失败算"
      # 同一套：一个取不到对照面的棘轮会**静默失效**，而它正是为此存在的。
      - name: 基线只许变短
        if: ${{ always() }}
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          case "$base" in
            ""|0000000000000000000000000000000000000000)
              echo "::warning::拿不到对照面（新分支的首次 push）—— 这一条跳过，其余照常"
              exit 0 ;;
          esac
          if ! git fetch --no-tags --depth=1 origin "$base" > fetch.log 2>&1; then
            echo "::error::取对照面失败（$base）—— 门禁不猜，按失败处理"
            tail -20 fetch.log
            exit 1
          fi
          if ! git show FETCH_HEAD:.github/gate-baseline.txt > old-baseline.txt 2> show.log \
             || [ ! -s old-baseline.txt ]; then
            echo "::error::对照面（$base）里读不到 .github/gate-baseline.txt —— 门禁不猜，按失败处理"
            tail -20 show.log
            exit 1
          fi
          # 基线是"套件名 [加说明]"的行；只比第一列，注释与空行不算
          norm() { grep -v '^[[:space:]]*#' "$1" | awk 'NF {print $1}' | sort -u; }
          norm old-baseline.txt > old.txt
          norm .github/gate-baseline.txt > new.txt
          comm -13 old.txt new.txt > added.txt
          if [ -s added.txt ]; then
            {
              echo "## 基线**变长了**（不许）"
              echo ""
              echo "基线是**实测出来的已知红**，只许变短：哪一条修好了，就在**同一个 PR 里**"
              echo "删掉它。往基线里**加**一条，等于把一条新红登记成合法 —— 门禁从此对那条"
              echo "视而不见。"
              echo ""
              echo "该做的是把那条红修掉；修不动就先开 issue，别登记进基线。"
              echo ""
              echo '```'
              cat added.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::基线多了 $(wc -l < added.txt | tr -d ' ') 条 —— $(paste -sd ' ' added.txt)"
            exit 1
          fi
          echo "基线只许变短: OK（比对照面少了 $(comm -23 old.txt new.txt | wc -l | tr -d ' ') 条）"

      # 分片那边红了，这一道必须**跟着红**。`needs` 的默认行为是"依赖失败就跳过"，
      # 而跳过**不算失败** —— 保护规则会当成"还没报"而永远等下去。所以这里显式看结果。
      - name: 分片有红就是红
        if: ${{ needs.static-exclusive.result != 'success' || needs.static-shard.result != 'success' }}
        run: |
          echo "::error::独占片 = ${{ needs.static-exclusive.result }}，分片 = ${{ needs.static-shard.result }} —— 门禁不通过"
          exit 1

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: gate-log-merged
          path: |
            gate.out
            red.txt
            base.txt
            new_red.txt
            confirmed.txt
            flaked.txt
            gone.txt
          if-no-files-found: warn
